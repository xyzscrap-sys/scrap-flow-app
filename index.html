<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrap Inward & Purchase Slip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen p-2 sm:p-4 flex items-center justify-center font-sans">

  <div class="w-full max-w-xl bg-sky-200 border-2 border-sky-600 rounded-lg shadow-2xl overflow-hidden text-slate-900 text-xs">
    
    <!-- Header -->
    <div class="bg-sky-400 border-b-2 border-sky-600 p-2 grid grid-cols-2 gap-2 font-semibold">
      <div class="flex items-center gap-1">
        <span class="w-16">MR No. :-</span>
        <input type="text" id="mr_no" value="231" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs font-bold outline-none" />
      </div>
      <div class="flex items-center gap-1">
        <span class="w-16">Date :-</span>
        <input type="text" id="entry_date" value="14.8.26" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs outline-none" />
      </div>
      <div class="flex items-center gap-1">
        <span class="w-16">Name :-</span>
        <input type="text" id="party_name" value="Kapil ji" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs font-bold outline-none" />
      </div>
      <div class="flex items-center gap-1">
        <span class="w-16">Veh. :-</span>
        <input type="text" id="veh_no" value="6799" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs outline-none" />
      </div>
    </div>

    <!-- Complete 11 Grades Table (Direct Fixed Rows) -->
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-center">
        <thead>
          <tr class="bg-sky-300 font-bold border-b border-sky-500 text-xs">
            <th class="p-1.5 border-r border-sky-500 text-left pl-2">Quality.</th>
            <th class="p-1.5 border-r border-sky-500 w-16">(+\-) Extra</th>
            <th class="p-1.5 border-r border-sky-500 w-20">Wt. (Kg)</th>
            <th class="p-1.5 border-r border-sky-500 w-20">Rate</th>
            <th class="p-1.5 w-24">Amount (₹)</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-sky-300 font-medium bg-sky-100 text-xs">
          <!-- 1. MC (New) [+1800] -->
          <tr data-std="1800">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">MC (New)</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 2. MC (Old) [+1000] -->
          <tr data-std="1000">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">MC (Old)</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 3. M.H. [+500] -->
          <tr data-std="500">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">M.H.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 4. S.H. [0] -->
          <tr data-std="0">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">S.H.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-bold text-sky-950" value="30030" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 5. Heavy [-600] -->
          <tr data-std="-600">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">Heavy</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 6. P.T. [-600] -->
          <tr data-std="-600">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">P.T.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 7. K.H. [-1300] -->
          <tr data-std="-1300">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">K.H.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 8. Com. [-2100] -->
          <tr data-std="-2100">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">Com.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 9. L.Com. [-3000] -->
          <tr data-std="-3000">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">L.Com.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 10. L.L. [-4000] -->
          <tr data-std="-4000">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">L.L.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
          <!-- 11. L2 [-5000] -->
          <tr data-std="-5000">
            <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">L2</td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="diff-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" value="0" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" class="wt-in w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none font-semibold" value="0" /></td>
            <td class="p-1 border-r border-sky-300 font-bold text-sky-900 rate-disp">0</td>
            <td class="p-1 font-bold amt-disp">0</td>
          </tr>
        </tbody>
        <tfoot class="bg-sky-200 border-t-2 border-sky-600 font-semibold text-xs divide-y divide-sky-400">
          <!-- Dust Row -->
          <tr>
            <td class="p-1.5 text-left pl-2 font-bold border-r border-sky-400">Dust</td>
            <td class="p-1 border-r border-sky-400">-</td>
            <td class="p-1 border-r border-sky-400">
              <input type="number" id="dust_wt" value="0" class="w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
            <td class="p-1 border-r border-sky-400">-</td>
            <td class="p-1">0</td>
          </tr>

          <!-- Total Wt Row -->
          <tr class="bg-sky-300/60 font-bold">
            <td class="p-1.5 text-left pl-2 border-r border-sky-500">Total Wt. :-</td>
            <td class="p-1 border-r border-sky-500" id="total_diff">0</td>
            <td class="p-1 border-r border-sky-500 text-sky-950 font-black" id="total_wt">0</td>
            <td class="p-1 border-r border-sky-500">-</td>
            <td class="p-1 font-black text-sky-950" id="total_amount">0</td>
          </tr>

          <!-- Penalty / Rate Diff & Tax -->
          <tr>
            <td colspan="2" class="p-1.5 text-left pl-2 font-bold border-r border-sky-400">Penalty / Rate diff.</td>
            <td class="p-1 border-r border-sky-400">
              <input type="number" id="penalty" value="0" class="w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
            <td class="p-1 font-bold border-r border-sky-400">Tax :-</td>
            <td class="p-1">
              <input type="number" id="tax_amount" value="0" class="w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
          </tr>

          <!-- TDS & G.Total -->
          <tr class="bg-sky-300/80 font-bold">
            <td class="p-1" id="tds_val">0</td>
            <td colspan="2" class="p-1.5 text-left pl-2 border-r border-sky-500">TDS 2%</td>
            <td class="p-1.5 font-bold border-r border-sky-500">G.Total</td>
            <td class="p-1 font-black text-sky-950 text-sm" id="g_total">0</td>
          </tr>

          <!-- S.H. Base Rate & Dr / Cr Note -->
          <tr class="bg-sky-400 font-bold">
            <td colspan="2" class="p-1 border-r border-sky-600">
              <div class="flex items-center gap-1">
                <span class="text-[10px] text-sky-900 font-bold">SH Base:</span>
                <input type="number" id="sh_base_rate" value="32600" class="w-full bg-white text-center py-0.5 border border-sky-700 rounded outline-none font-bold text-sky-950" placeholder="Base Rate" />
              </div>
            </td>
            <td colspan="2" class="p-1.5 text-right pr-2 border-r border-sky-600 font-bold">Dr & Cr Note :-</td>
            <td class="p-1 text-sm font-black text-rose-950" id="dr_cr_note">0</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Action Button -->
    <div class="p-3 bg-sky-300 border-t-2 border-sky-600 flex flex-col gap-2">
      <button type="button" id="saveBtn" class="w-full bg-sky-800 hover:bg-sky-900 text-white font-bold py-2.5 rounded shadow text-sm transition">
        Save Slip to Supabase Cloud
      </button>
      <p id="statusMsg" class="text-center font-bold text-xs hidden"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ovqsxqpqhxbicfbdrcaj.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cXN4cXBxaHhiaWNmYmRyY2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNDk3MzMsImV4cCI6MjA1Njg0OTczM30.OnfnOVxQFz5nRxqUGd2YHrmS2SSx4MbHSgK8GjYSzDo";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    function calculateSlip() {
      const shBase = parseFloat(document.getElementById('sh_base_rate').value) || 0;
      let totalWt = 0;
      let totalDiff = 0;
      let totalAmount = 0;

      const rows = document.querySelectorAll('tbody tr');
      rows.forEach(row => {
        const stdDiff = parseFloat(row.getAttribute('data-std')) || 0;
        const extraDiff = parseFloat(row.querySelector('.diff-in').value) || 0;
        const wt = parseFloat(row.querySelector('.wt-in').value) || 0;

        const effectiveRate = shBase + stdDiff + extraDiff;
        row.querySelector('.rate-disp').innerText = effectiveRate;

        const amt = Math.round((wt * effectiveRate) / 1000);
        row.querySelector('.amt-disp').innerText = amt;

        totalDiff += extraDiff;
        totalWt += wt;
        totalAmount += amt;
      });

      const dustWt = parseFloat(document.getElementById('dust_wt').value) || 0;
      const penalty = parseFloat(document.getElementById('penalty').value) || 0;
      const tax = parseFloat(document.getElementById('tax_amount').value) || 0;

      const netEffectiveWt = totalWt - dustWt;
      document.getElementById('total_diff').innerText = totalDiff;
      document.getElementById('total_wt').innerText = netEffectiveWt;
      document.getElementById('total_amount').innerText = totalAmount;

      const tds = Math.round(totalAmount * 0.02);
      document.getElementById('tds_val').innerText = tds;

      const gTotal = totalAmount + tax - penalty;
      document.getElementById('g_total').innerText = gTotal;

      const baseExpectedVal = Math.round((netEffectiveWt * shBase) / 1000);
      const drCr = gTotal - baseExpectedVal;
      document.getElementById('dr_cr_note').innerText = Math.abs(drCr);

      return { netEffectiveWt, totalAmount, gTotal, drCr, shBase };
    }

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', calculateSlip);
    });

    calculateSlip();

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.innerText = "Saving to Database...";

      const res = calculateSlip();
      const payload = {
        mr_no: document.getElementById('mr_no').value,
        party_name: document.getElementById('party_name').value,
        veh_no: document.getElementById('veh_no').value,
        base_rate: res.shBase,
        plant_wt: res.netEffectiveWt,
        gross_bill_val: res.gTotal,
        drcr_amount: res.drCr
      };

      const { error } = await supabase.from('scrap_master').insert([payload]);
      msg.classList.remove('hidden');
      if (error) {
        msg.className = "text-center font-bold text-xs text-red-700 block";
        msg.innerText = "Error: " + error.message;
      } else {
        msg.className = "text-center font-bold text-xs text-emerald-800 block";
        msg.innerText = "✓ Slip Saved to Database Successfully!";
      }
      btn.disabled = false;
      btn.innerText = "Save Slip to Supabase Cloud";
    });
  </script>
</body>
</html>
