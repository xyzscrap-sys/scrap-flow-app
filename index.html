<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrap Inward Billing Slip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen p-2 sm:p-4 flex items-center justify-center font-sans">

  <div class="w-full max-w-xl bg-sky-200 border-2 border-sky-600 rounded-lg shadow-2xl overflow-hidden text-slate-900 text-sm">
    
    <!-- Top Header: MR, Date, Name, Veh -->
    <div class="bg-sky-400 border-b-2 border-sky-600 p-2 grid grid-cols-2 gap-2 font-semibold">
      <div class="flex items-center gap-1">
        <span class="w-16">MR No. :-</span>
        <input type="text" id="mr_no" value="231" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs font-bold outline-none" />
      </div>
      <div class="flex items-center gap-1">
        <span class="w-16">Date :-</span>
        <input type="text" id="entry_date" value="14.8.26" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs outline-none" />
      </div>
      <div class="flex items-center gap-1">
        <span class="w-16">Name :-</span>
        <input type="text" id="party_name" value="Kapil ji" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs font-bold outline-none" />
      </div>
      <div class="flex items-center gap-1">
        <span class="w-16">Veh. :-</span>
        <input type="text" id="veh_no" value="6799" class="w-full bg-white border border-sky-700 px-2 py-0.5 rounded text-xs outline-none" />
      </div>
    </div>

    <!-- Quality Table -->
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-center">
        <thead>
          <tr class="bg-sky-300 font-bold border-b border-sky-500 text-xs">
            <th class="p-1.5 border-r border-sky-500 text-left pl-2">Quality.</th>
            <th class="p-1.5 border-r border-sky-500 w-12">(+\-)</th>
            <th class="p-1.5 border-r border-sky-500 w-20">Wt.</th>
            <th class="p-1.5 border-r border-sky-500 w-20">Rate</th>
            <th class="p-1.5 w-24">Amount</th>
          </tr>
        </thead>
        <tbody id="qualityRows" class="divide-y divide-sky-300 font-medium text-xs bg-sky-100">
          <!-- Rows will render here -->
        </tbody>
        <tfoot class="bg-sky-200 border-t-2 border-sky-600 font-semibold text-xs divide-y divide-sky-400">
          <!-- Dust Row -->
          <tr>
            <td class="p-1.5 text-left pl-2 font-bold border-r border-sky-400">Dust</td>
            <td class="p-1 border-r border-sky-400">-</td>
            <td class="p-1 border-r border-sky-400">
              <input type="number" id="dust_wt" value="0" class="calc-input w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
            <td class="p-1 border-r border-sky-400">-</td>
            <td class="p-1" id="dust_amount">0</td>
          </tr>

          <!-- Total Wt Row -->
          <tr class="bg-sky-300/60">
            <td class="p-1.5 text-left pl-2 font-bold border-r border-sky-500">Total Wt. :-</td>
            <td class="p-1 border-r border-sky-500" id="total_diff">0</td>
            <td class="p-1 border-r border-sky-500 font-bold" id="total_wt">0</td>
            <td class="p-1 border-r border-sky-500">-</td>
            <td class="p-1 font-bold" id="total_amount">0</td>
          </tr>

          <!-- Penalty / Rate Diff & Tax -->
          <tr>
            <td colspan="2" class="p-1.5 text-left pl-2 font-bold border-r border-sky-400">Penalty / Rate diff.</td>
            <td class="p-1 border-r border-sky-400">
              <input type="number" id="penalty" value="0" class="calc-input w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
            <td class="p-1 font-bold border-r border-sky-400">Tax :-</td>
            <td class="p-1">
              <input type="number" id="tax_amount" value="0" class="calc-input w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
          </tr>

          <!-- TDS & G.Total -->
          <tr class="bg-sky-300/70 font-bold">
            <td class="p-1" id="tds_val">0</td>
            <td colspan="2" class="p-1.5 text-left pl-2 border-r border-sky-500">TDS 2%</td>
            <td class="p-1.5 font-bold border-r border-sky-500">G.Total</td>
            <td class="p-1 font-bold text-sky-950 text-sm" id="g_total">0</td>
          </tr>

          <!-- Base Rate & Dr / Cr Note -->
          <tr class="bg-sky-400 font-bold">
            <td colspan="2" class="p-1 border-r border-sky-600">
              <input type="number" id="base_final_rate" value="32600" class="calc-input w-full bg-white text-center py-0.5 border border-sky-700 rounded outline-none font-bold" placeholder="Base Rate" />
            </td>
            <td colspan="2" class="p-1.5 text-right pr-2 border-r border-sky-600">Dr & Cr Note :-</td>
            <td class="p-1 text-sm font-black text-rose-900" id="dr_cr_note">0</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Action Button -->
    <div class="p-3 bg-sky-300 border-t-2 border-sky-600 flex flex-col gap-2">
      <button type="button" id="saveBtn" class="w-full bg-sky-700 hover:bg-sky-800 text-white font-bold py-2.5 rounded shadow text-sm transition">
        Save Slip to Supabase Cloud
      </button>
      <p id="statusMsg" class="text-center font-bold text-xs hidden"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ovqsxqpqhxbicfbdrcaj.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cXN4cXBxaHhiaWNmYmRyY2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNDk3MzMsImV4cCI6MjA1Njg0OTczM30.OnfnOVxQFz5nRxqUGd2YHrmS2SSx4MbHSgK8GjYSzDo";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const grades = [
      { id: "mc_new", name: "MC (New)", rate: 34400 },
      { id: "mc_old", name: "MC (Old)", rate: 33600 },
      { id: "mh", name: "M.H.", rate: 33100 },
      { id: "sh", name: "S.H.", rate: 32600, defaultWt: 30030 },
      { id: "heavy", name: "Heavy", rate: 32000 },
      { id: "pt", name: "P.T.", rate: 32000 },
      { id: "kh", name: "K.H.", rate: 31300 },
      { id: "com", name: "Com.", rate: 30500 },
      { id: "lcom", name: "L.Com.", rate: 29600 },
      { id: "ll", name: "L.L.", rate: 28600 },
      { id: "l2", name: "L2", rate: 27600 }
    ];

    const tbody = document.getElementById('qualityRows');
    grades.forEach(g => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="p-1.5 text-left pl-2 font-semibold border-r border-sky-300">${g.name}</td>
        <td class="p-1 border-r border-sky-300">
          <input type="number" id="diff_${g.id}" value="0" class="calc-input w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" />
        </td>
        <td class="p-1 border-r border-sky-300">
          <input type="number" id="wt_${g.id}" value="${g.defaultWt || 0}" class="calc-input w-full bg-white text-center py-0.5 border border-sky-300 rounded font-semibold outline-none" />
        </td>
        <td class="p-1 border-r border-sky-300">
          <input type="number" id="rate_${g.id}" value="${g.rate}" class="calc-input w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" />
        </td>
        <td class="p-1 font-bold" id="amt_${g.id}">0</td>
      `;
      tbody.appendChild(tr);
    });

    function calculateSlip() {
      let totalWt = 0;
      let totalDiff = 0;
      let totalAmount = 0;

      grades.forEach(g => {
        const diff = parseFloat(document.getElementById(`diff_${g.id}`).value) || 0;
        const wt = parseFloat(document.getElementById(`wt_${g.id}`).value) || 0;
        const rate = parseFloat(document.getElementById(`rate_${g.id}`).value) || 0;
        
        // Scrap rate is per ton (divided by 1000)
        const amt = Math.round((wt * rate) / 1000);
        document.getElementById(`amt_${g.id}`).innerText = amt;

        totalDiff += diff;
        totalWt += wt;
        totalAmount += amt;
      });

      const dustWt = parseFloat(document.getElementById('dust_wt').value) || 0;
      const penalty = parseFloat(document.getElementById('penalty').value) || 0;
      const tax = parseFloat(document.getElementById('tax_amount').value) || 0;
      const baseFinalRate = parseFloat(document.getElementById('base_final_rate').value) || 0;

      const netEffectiveWt = totalWt - dustWt;
      document.getElementById('total_diff').innerText = totalDiff;
      document.getElementById('total_wt').innerText = netEffectiveWt;
      document.getElementById('total_amount').innerText = totalAmount;

      const tds = Math.round(totalAmount * 0.02);
      document.getElementById('tds_val').innerText = tds;

      const gTotal = totalAmount + tax - penalty;
      document.getElementById('g_total').innerText = gTotal;

      // Base Billing comparison for Dr/Cr Note
      const baseExpectedVal = Math.round((netEffectiveWt * baseFinalRate) / 1000);
      const drCr = gTotal - baseExpectedVal;
      document.getElementById('dr_cr_note').innerText = Math.abs(drCr);

      return { totalWt: netEffectiveWt, totalAmount, gTotal, drCr };
    }

    document.querySelectorAll('.calc-input').forEach(input => {
      input.addEventListener('input', calculateSlip);
    });

    calculateSlip();

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.innerText = "Saving...";

      const res = calculateSlip();
      const payload = {
        mr_no: document.getElementById('mr_no').value,
        party_name: document.getElementById('party_name').value,
        veh_no: document.getElementById('veh_no').value,
        plant_wt: res.totalWt,
        gross_bill_val: res.gTotal,
        drcr_amount: res.drCr
      };

      const { error } = await supabase.from('scrap_master').insert([payload]);
      msg.classList.remove('hidden');
      if (error) {
        msg.className = "text-center font-bold text-xs text-red-700 block";
        msg.innerText = "Error: " + error.message;
      } else {
        msg.className = "text-center font-bold text-xs text-emerald-800 block";
        msg.innerText = "✓ Slip Saved to Database Successfully!";
      }
      btn.disabled = false;
      btn.innerText = "Save Slip to Supabase Cloud";
    });
  </script>
</body>
</html>
