            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_2" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_2" value="33600" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>

          <!-- 3. M.H. -->
          <tr>

            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_3" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_3" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_3" value="33100" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_3">0</td>

            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_4" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_4" value="30030" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded font-bold outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_4" value="32600" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_4">0</td>
          </tr>
          <!-- 5. Heavy -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">Heavy</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_5" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_5" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_5" value="32000" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_5">0</td>
          </tr>
          <!-- 6. P.T. -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">P.T.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_6" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_6" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_6" value="32000" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_6">0</td>
          </tr>
          <!-- 7. K.H. -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">K.H.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_7" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_7" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_7" value="31300" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_7">0</td>
          </tr>
          <!-- 8. Com. -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">Com.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_8" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_8" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_8" value="30500" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_8">0</td>
          </tr>
          <!-- 9. L.Com. -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">L.Com.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_9" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_9" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_9" value="29600" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_9">0</td>
          </tr>
          <!-- 10. L.L. -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">L.L.</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_10" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_10" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_10" value="28600" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_10">0</td>
          </tr>
          <!-- 11. L2 -->
          <tr>
            <td class="p-1 text-left pl-2 font-semibold border-r border-sky-300">L2</td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="diff_10" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="wt_11" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 border-r border-sky-300"><input type="number" id="rate_11" value="27600" class="calc-row w-full bg-white text-center py-0.5 border border-sky-300 rounded outline-none" /></td>
            <td class="p-1 font-bold" id="amt_11">0</td>
          </tr>
        </tbody>
        <tfoot class="bg-sky-200 border-t-2 border-sky-600 font-semibold text-xs divide-y divide-sky-400">
          <!-- Dust Row -->
          <tr>
            <td class="p-1.5 text-left pl-2 font-bold border-r border-sky-400">Dust</td>
            <td class="p-1 border-r border-sky-400">-</td>
            <td class="p-1 border-r border-sky-400">
              <input type="number" id="dust_wt" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
            <td class="p-1 border-r border-sky-400">-</td>
            <td class="p-1">0</td>
          </tr>

          <!-- Total Wt Row -->
          <tr class="bg-sky-300/60 font-bold">
            <td class="p-1.5 text-left pl-2 border-r border-sky-500">Total Wt. :-</td>
            <td class="p-1 border-r border-sky-500" id="total_diff">0</td>
            <td class="p-1 border-r border-sky-500" id="total_wt">30030</td>
            <td class="p-1 border-r border-sky-500">-</td>
            <td class="p-1" id="total_amount">978978</td>
          </tr>

          <!-- Penalty / Rate Diff & Tax -->
          <tr>
            <td colspan="2" class="p-1.5 text-left pl-2 font-bold border-r border-sky-400">Penalty / Rate diff.</td>
            <td class="p-1 border-r border-sky-400">
              <input type="number" id="penalty" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
            <td class="p-1 font-bold border-r border-sky-400">Tax :-</td>
            <td class="p-1">
              <input type="number" id="tax_amount" value="0" class="calc-row w-full bg-white text-center py-0.5 border border-sky-400 rounded outline-none" />
            </td>
          </tr>

          <!-- TDS & G.Total -->
          <tr class="bg-sky-300/80 font-bold">
            <td class="p-1" id="tds_val">0</td>
            <td colspan="2" class="p-1.5 text-left pl-2 border-r border-sky-500">TDS 2%</td>
            <td class="p-1.5 font-bold border-r border-sky-500">G.Total</td>
            <td class="p-1 font-bold text-sky-950" id="g_total">978978</td>
          </tr>

          <!-- Base Rate & Dr / Cr Note -->
          <tr class="bg-sky-400 font-bold">
            <td colspan="2" class="p-1 border-r border-sky-600">
              <input type="number" id="base_rate" value="32600" class="calc-row w-full bg-white text-center py-0.5 border border-sky-700 rounded outline-none font-bold" placeholder="Base Rate" />
            </td>
            <td colspan="2" class="p-1.5 text-right pr-2 border-r border-sky-600">Dr & Cr Note :-</td>
            <td class="p-1 text-sm font-black text-rose-900" id="dr_cr_note">0</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Action Button -->
    <div class="p-3 bg-sky-300 border-t-2 border-sky-600 flex flex-col gap-2">
      <button type="button" id="saveBtn" class="w-full bg-sky-700 hover:bg-sky-800 text-white font-bold py-2.5 rounded shadow text-sm transition">
        Save Slip to Supabase Cloud
      </button>
      <p id="statusMsg" class="text-center font-bold text-xs hidden"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ovqsxqpqhxbicfbdrcaj.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92cXN4cXBxaHhiaWNmYmRyY2FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNDk3MzMsImV4cCI6MjA1Njg0OTczM30.OnfnOVxQFz5nRxqUGd2YHrmS2SSx4MbHSgK8GjYSzDo";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    function runCalculations() {
      let totalWt = 0;
      let totalDiff = 0;
      let totalAmount = 0;

      for (let i = 1; i <= 11; i++) {
        const diff = parseFloat(document.getElementById(`diff_${i}`)?.value) || 0;
        const wt = parseFloat(document.getElementById(`wt_${i}`)?.value) || 0;
        const rate = parseFloat(document.getElementById(`rate_${i}`)?.value) || 0;
        
        // Scrap amount: (Wt * Rate) / 1000
        const amt = Math.round((wt * rate) / 1000);
        document.getElementById(`amt_${i}`).innerText = amt;

        totalDiff += diff;
        totalWt += wt;
        totalAmount += amt;
      }

      const dustWt = parseFloat(document.getElementById('dust_wt').value) || 0;
      const penalty = parseFloat(document.getElementById('penalty').value) || 0;
      const tax = parseFloat(document.getElementById('tax_amount').value) || 0;
      const baseRate = parseFloat(document.getElementById('base_rate').value) || 0;

      const netPlantWt = totalWt - dustWt;
      document.getElementById('total_diff').innerText = totalDiff;
      document.getElementById('total_wt').innerText = netPlantWt;
      document.getElementById('total_amount').innerText = totalAmount;

      const tds = Math.round(totalAmount * 0.02);
      document.getElementById('tds_val').innerText = tds;

      const gTotal = totalAmount + tax - penalty;
      document.getElementById('g_total').innerText = gTotal;

      const baseExpectedVal = Math.round((netPlantWt * baseRate) / 1000);
      const drCr = gTotal - baseExpectedVal;
      document.getElementById('dr_cr_note').innerText = Math.abs(drCr);

      return { netPlantWt, totalAmount, gTotal, drCr };
    }

    document.querySelectorAll('.calc-row').forEach(input => {
      input.addEventListener('input', runCalculations);
    });

    runCalculations();

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('statusMsg');
      btn.disabled = true;
      btn.innerText = "Saving...";

      const res = runCalculations();
      const payload = {
        mr_no: document.getElementById('mr_no').value,
        party_name: document.getElementById('party_name').value,
        veh_no: document.getElementById('veh_no').value,
        plant_wt: res.netPlantWt,
        gross_bill_val: res.gTotal,
        drcr_amount: res.drCr
      };

      const { error } = await supabase.from('scrap_master').insert([payload]);
      msg.classList.remove('hidden');
      if (error) {
        msg.className = "text-center font-bold text-xs text-red-700 block";
        msg.innerText = "Error: " + error.message;
      } else {
        msg.className = "text-center font-bold text-xs text-emerald-800 block";
        msg.innerText = "✓ Slip Saved to Database Successfully!";
      }
      btn.disabled = false;
      btn.innerText = "Save Slip to Supabase Cloud";
    });
  </script>
</body>
</html>
